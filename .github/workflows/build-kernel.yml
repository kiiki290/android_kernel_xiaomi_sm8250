name: build-kernel-pidns

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison flex libssl-dev make zip git wget cpio \
            device-tree-compiler libncurses-dev

      - name: Download AOSP clang r522817 (clang 17, LineageOS 23.2 era)
        run: |
          mkdir -p toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r522817.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain
          ls toolchain/bin/ | head -20

      - name: Build kernel
        run: |
          export PATH="$PWD/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          # Qualcomm techpack: local trace headers (TRACE_INCLUDE_PATH .) and
          # cross-referenced driver headers need the techpack dirs on -I.
          # Use RELATIVE paths (absolute paths blew the arg limit) and KCFLAGS
          # (target-only; KCPPFLAGS polluted the host-tool build too).
          INC=""
          for d in $(find techpack drivers/clk/qcom -type d 2>/dev/null | sort); do
            INC="$INC -I$d"
          done
          echo "=== adding include paths ($(echo $INC | wc -w) dirs) ==="
          make CC=clang LLVM=1 LLVM_IAS=1 vendor/kona-perf-pidns_defconfig
          make CC=clang LLVM=1 LLVM_IAS=1 KCFLAGS="$INC" \
               V=1 -j$(nproc) Image > build.log 2>&1 || {
            echo "===== BUILD FAILED ====="
            # print the clang command line (V=1) of the first failing file, plus the error
            awk '/\.c$/ && /clang/ {cmd=$0} /fatal error/ {print "--- COMPILE CMD (truncated) ---"; print substr(cmd,1,1500); print "--- ERROR ---"; print; exit}' build.log
            echo "=== last 20 lines ==="
            tail -20 build.log
            exit 1
          }
          tail -10 build.log
          echo "=== kernel version ==="
          strings arch/arm64/boot/Image | grep -m1 "Linux version" || true
          ls -la arch/arm64/boot/Image

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-pidns
          path: |
            arch/arm64/boot/Image
            .config
            build.log
