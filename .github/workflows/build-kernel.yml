name: build-kernel-pidns

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison flex libssl-dev make zip git wget cpio \
            device-tree-compiler libncurses-dev

      - name: Download AOSP clang r450784d (Clang 14, tested for 4.19)
        run: |
          mkdir -p toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/r450784d/clang-r450784d.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain
          ls toolchain/bin/ | head -20

      - name: Build kernel
        run: |
          export PATH="$PWD/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          make CC=clang LLVM=1 LLVM_IAS=1 vendor/kona-perf-pidns_defconfig
          make CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc) Image dtbs dtb.img dtbo.img 2>&1 | tail -40
          echo "=== kernel version ==="
          strings arch/arm64/boot/Image | grep -m1 "Linux version"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-pidns
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dtb.img
            arch/arm64/boot/dtbo.img
            arch/arm64/boot/dts/vendor/qcom/*.dtb
            .config
