name: build-kernel-pidns

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison flex libssl-dev make zip git wget cpio \
            device-tree-compiler libncurses-dev

      - name: Download AOSP clang r563880c (clang 21, official LineageOS 23.2 compiler)
        run: |
          mkdir -p toolchain
          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r563880c.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain
          # tarball may unpack as clang-r563880c/bin/clang or directly bin/clang:
          # locate the real clang binary so either layout works.
          CLANG_BIN=$(dirname "$(find toolchain -path '*/bin/clang' -type f 2>/dev/null | head -1)")
          test -n "$CLANG_BIN" || { echo "clang binary not found in tarball"; exit 1; }
          echo "CLANG_BIN=$PWD/$CLANG_BIN" >> "$GITHUB_ENV"
          echo "=== clang bin contents ==="
          ls "$PWD/$CLANG_BIN" | head -20
          "$PWD/$CLANG_BIN/clang" --version | head -2

      - name: Build kernel
        run: |
          export PATH="$CLANG_BIN:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          # Qualcomm techpack: local trace headers use TRACE_INCLUDE_PATH ., so
          # define_trace.h's `#include "./trace.h"` (cwd-relative, falls back to -I)
          # needs the techpack dirs that own a trace.h on -I.
          # CRITICAL: never add kernel-tree dirs like drivers/clk/qcom here — that
          # makes unrelated define_trace expansions (e.g. regmap.c) resolve ./trace.h
          # to clk/qcom/trace.h and die with an implicit-declaration error.
          # Official LOS builds add no -I at all (KCFLAGS empty under LLVM).
          # Use RELATIVE paths (absolute paths blew the arg limit) and KCFLAGS
          # (target-only; KCPPFLAGS polluted the host-tool build too).
          INC=""
          for d in $(find techpack -name trace.h -type f 2>/dev/null | xargs -n1 dirname | sort -u); do
            INC="$INC -I$d"
          done
          echo "=== adding include paths ($(echo $INC | wc -w) dirs) ==="
          make CC=clang LLVM=1 LLVM_IAS=1 vendor/kona-perf-pidns_defconfig
          make CC=clang LLVM=1 LLVM_IAS=1 KCFLAGS="$INC" \
               V=1 -j$(nproc) Image > build.log 2>&1 || {
            echo "===== BUILD FAILED ====="
            # print the clang command line (V=1) of the first failing file, plus the error
            awk '/\.c$/ && /clang/ {cmd=$0} /fatal error/ {print "--- COMPILE CMD (truncated) ---"; print substr(cmd,1,1500); print "--- ERROR ---"; print; exit}' build.log
            echo "=== last 20 lines ==="
            tail -20 build.log
            exit 1
          }
          tail -10 build.log
          echo "=== kernel version ==="
          strings arch/arm64/boot/Image | grep -m1 "Linux version" || true
          ls -la arch/arm64/boot/Image

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-pidns
          path: |
            arch/arm64/boot/Image
            .config
            build.log
